<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskhive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <aside class="sidebar">
            <div class="logo">TaskHive</div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <span class="icon">📊</span>
                    <span class="text">Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon">📂</span>
                    <span class="text">Projects</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon">👤</span>
                    <span class="text">Profile</span>
                </a>
            </nav>
            
            <div class="nav-footer">
                <a href="#" class="nav-item">
                    <span class="icon">🚪</span>
                    <span class="text">Logout</span>
                </a>
            </div>
        </aside>
        <section class="right-sidebar">
            <nav class="nav-bar">
                <div class="welcome-message">
                    <h1 class="text-2xl font-semibold text-gray-800">Welcome back, Astro!</h1>
                    <p class="text-gray-600">Ready to tackle your tasks today?</p>
                </div>
                <div class="user-avatar">
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="User Avatar" class="w-10 h-10 rounded-full">
                    <div class="avatar-name">
                        <h1>Astro Mario</h1>
                        <p>astromario@gmail.com</p>
                    </div>
                </div>
            </nav>
            <div class="content-section">
                <div class="summary-tab">
                    <div class="cards">
                        <div class="card-text">
                            <h1>Active Projects</h1>
                            <h2>78</h2>
                        </div>
                    </div>
                    <div class="cards">
                        <div class="card-text">
                            <h1>Completed Tasks</h1>
                            <h2>78</h2>
                        </div>
                        <a href="" title="foursquare check in icons">Foursquare check in icons created by juicy_fish - Flaticon</a>
                    </div>
                    <div class="cards">
                        <div class="card-text">
                            <h1>Team Members</h1>
                            <h2>23</h2>
                        </div>
                    </div>
                </div>
                <div class="head-tag">
                    <!-- Be very alert and watch this space -->
                </div>
                <div class="recent-projects">
                    <!-- Let's all work together for the good of humanity -->
                </div>
            </div>
        </section>
    </main>
</body>
</html>
