<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskhive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <section class="content-column-left">
      <img src="woman-organizing.jpg" class="login-page-image" alt="Woman organizing her work">
      <h1>
         Organize Your Tasks,<br>
         Amplify Your Success
      </h1>
      <h2>
        Join thousands of professionals who trust TaskHive to<br>
        streamline their workflow
      </h2>
    </section>
    <aside class="content-column-right">
      <h2>TaskHive</h2>
      <form class="sign-up-form" action="dashboard.html" method="GET">
        <h1>Sign Up</h1>
        <!-- Input fields -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required>
        </div>

        <!-- Checkbox (Remember Me) -->
        <div class="form-group remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Sign Up</button>
        <!-- <a href="dashboard.html" class="submit-btn">Sign Up</a> -->
        <!-- Alternative Login Option -->
        <p class="login-link">Already have an account? <a href="#">Log in</a></p>
      </form>
    </aside>
  </main>
</body>
</html>
